<?xml version="1.0" encoding="UTF-8"?>
<!-- NexusOS "Abstract Technology" wallpaper master, 3840x2160. Circuit-trace motif built on 30/60 degree geometry.
     Original artwork, (c) NexusOS contributors, GPL-2.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <title>NexusOS Abstract Technology</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0B171B"/>
      <stop offset="1" stop-color="#102E33"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#31C6BD" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#31C6BD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31C6BD" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#31C6BD" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#31C6BD" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <rect width="3840" height="2160" fill="url(#pool)"/>
  <!-- Circuit traces: horizontal runs joined by 30-degree bends -->
  <g fill="none" stroke="url(#trace)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 620 H1100 L1273 720 H2100 L2273 620 H3840"/>
    <path d="M0 820 H900 L1073 920 H1900 L2073 1020 H3840"/>
    <path d="M0 1080 H1400 L1573 1180 H2500 L2673 1080 H3840"/>
    <path d="M0 1340 H700 L873 1240 H1700 L1873 1340 H3840"/>
    <path d="M0 1560 H1250 L1423 1460 H2300 L2473 1560 H3840"/>
  </g>
  <g fill="none" stroke="#31C6BD" stroke-opacity="0.12" stroke-width="2">
    <path d="M0 500 H3840 M0 1700 H3840"/>
    <path d="M0 720 H600 M3200 920 H3840 M0 1460 H500 M3300 1240 H3840"/>
  </g>
  <!-- Nodes -->
  <g fill="#0B171B" stroke="#31C6BD" stroke-width="4">
    <circle cx="1100" cy="620" r="14"/><circle cx="2100" cy="720" r="14"/>
    <circle cx="1900" cy="920" r="14"/><circle cx="2500" cy="1180" r="14"/>
    <circle cx="873" cy="1240" r="14"/><circle cx="1700" cy="1240" r="14"/>
    <circle cx="2300" cy="1460" r="14"/>
  </g>
  <g fill="#C47750">
    <circle cx="1573" cy="1180" r="18"/>
    <circle cx="2273" cy="620" r="10"/>
    <circle cx="1423" cy="1460" r="10"/>
  </g>
  <!-- Central chip outline -->
  <g transform="translate(1920 1080)">
    <rect x="-260" y="-160" width="520" height="320" rx="18" fill="#142328" fill-opacity="0.75" stroke="#29434A" stroke-width="4"/>
    <rect x="-260" y="-160" width="520" height="320" rx="18" fill="none" stroke="#31C6BD" stroke-opacity="0.45" stroke-width="2"/>
    <g transform="translate(-64 -84) scale(0.5)">
      <polygon points="128,12 228.5,70 228.5,186 128,244 27.5,186 27.5,70" fill="none" stroke="#31C6BD" stroke-width="6"/>
      <polygon points="76,180 76,76 100,76 156,148 156,76 180,76 180,180 156,180 100,108 100,180" fill="#31C6BD"/>
    </g>
  </g>
</svg>
