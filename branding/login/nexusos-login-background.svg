  <rect width="3840" height="2160" fill="url(#bg)"/>
  <rect width="3840" height="2160" fill="url(#hex)"/>
  <rect x="1620" y="1960" width="600" height="2" fill="#29434A"/>
  <rect x="1880" y="1960" width="80" height="2" fill="#C47750"/>
