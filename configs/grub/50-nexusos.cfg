# NexusOS: keep Ubuntu's EFI boot identity.
#
# GRUB_DISTRIBUTOR defaults to os-release NAME, which is "NexusOS" here. grub-install uses
# it as the EFI directory (/EFI/<distributor>/), but Ubuntu's Canonical-signed GRUB looks
# for its configuration in /EFI/ubuntu/. Changing it would break Secure Boot after the
# next GRUB update, so the boot menu keeps the Ubuntu name. NexusOS ships no bootloader
# or signing keys of its own (docs/security.md).
GRUB_DISTRIBUTOR="Ubuntu"
