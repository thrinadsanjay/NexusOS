# NexusOS SDDM defaults -- installed as /etc/sddm.conf.d/50-nexusos.conf by nexusos-desktop.
# Placeholder: uses the upstream Breeze greeter until the "nexus" SDDM theme exists.
# Files sort after Kubuntu's 10-/20- drop-ins; /etc/sddm.conf (admin) still overrides.
