<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations Dashboard</title>
<style>
:root {
  --bg: #0A1519; --bg-raise: #0E1C21; --panel: #12232A; --panel-2: #172C33; --line: #23404A; --line-soft: #1B333B;
  --text: #E8F1F2; --text2: #9EB3B7; --text3: #6F878C;
  --accent: #31C6BD; --copper: #C47750; --pos: #3DBE7A; --warn: #E0AE4A; --neg: #E0625A;
  --c-cpu: #31C6BD; --c-mem: #3DBE7A; --c-gpu: #A38BF5; --c-disk: #E0AE4A; --c-vuln: #E0625A; --c-upd: #5AA9E6; --c-net: #3DBE7A; --c-mnt: #4FC3E0;
  --chip-a: 0.16; --shadow: 0 14px 36px rgba(0,0,0,.5); --sel: #163E45;
}
:root[data-theme="light"] {
  --bg: #EEF4F5; --bg-raise: #FFFFFF; --panel: #FFFFFF; --panel-2: #F5F9FA; --line: #D3E0E3; --line-soft: #E4EDEF;
  --text: #0B171B; --text2: #4A6066; --text3: #7A8F94;
  --accent: #1E8F88; --copper: #A85F3C; --pos: #25864F; --warn: #A87308; --neg: #B9423A;
  --c-cpu: #1E8F88; --c-mem: #25864F; --c-gpu: #6E55D6; --c-disk: #A87308; --c-vuln: #B9423A; --c-upd: #2B7BC0; --c-net: #25864F; --c-mnt: #1B8FB0;
  --chip-a: 0.12; --shadow: 0 14px 36px rgba(11,23,27,.16); --sel: #DDF0EE;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.35 Inter, "Noto Sans", sans-serif; font-feature-settings: "tnum" 1;
       overflow: hidden; -webkit-font-smoothing: antialiased; }
svg { display: block; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ------------------------------------------------------------- title bar */
.bar { height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 20px; background: var(--bg-raise); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 10px; width: 202px; }
.logo b { font-size: 17px; font-weight: 700; letter-spacing: .02em; display: block; line-height: 1.1; }
.logo small { color: var(--text2); font-size: 11px; }
.vsep { width: 1px; height: 36px; background: var(--line); }
.app-title b { font-size: 16px; font-weight: 600; display: block; }
.app-title small { color: var(--text2); font-size: 12px; }
.health { margin: 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 8px; font-weight: 600;
          color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.health i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 22%, transparent); }
.health span { color: var(--text2); font-weight: 500; }
.tb { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--text2); position: relative; }
.badge { position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--copper); color: #fff;
         font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.clock { text-align: right; color: var(--text2); font-size: 12px; line-height: 1.3; } .clock b { color: var(--text); font-weight: 600; display: block; font-size: 13px; }

/* ------------------------------------------------------------- sidebar */
.app { display: grid; grid-template-columns: 236px 1fr; height: calc(100vh - 64px); }
.side { background: var(--bg-raise); border-right: 1px solid var(--line); padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.nav { display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 10px; border-radius: 8px; color: var(--text2); font-weight: 500; }
.nav .chev { margin-left: auto; width: 14px; height: 14px; color: var(--text3); }
.nav.on { background: var(--sel); color: var(--text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
.nav.on .ico { color: var(--accent); }
.sub { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px 0 22px; margin-left: 10px; border-left: 1px solid var(--line); color: var(--text2); font-size: 12.5px; }
.sub .ico { width: 16px; height: 16px; }
.sub.on { color: var(--accent); font-weight: 600; border-left: 2px solid var(--accent); padding-left: 21px; }
.cnt { margin-left: auto; min-width: 20px; height: 20px; border-radius: 10px; background: var(--neg); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.cnt + .chev { margin-left: 8px; }
.user { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--bg); background: var(--accent); }
.user b { display: block; font-size: 13px; } .user small { color: var(--text2); font-size: 11px; }

/* ------------------------------------------------------------- content */
.content { padding: 20px 24px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 14px; min-width: 0; overflow: hidden; position: relative; }
.ph { display: flex; align-items: center; gap: 10px; }
.ph h1 { font-size: 24px; font-weight: 650; letter-spacing: -.01em; line-height: 1.15; }
.ph p { color: var(--text2); margin-top: 3px; }
.ph .grow { flex: 1; }
.ctl { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-weight: 500;
       display: inline-flex; align-items: center; gap: 8px; }
.ctl .ico { width: 16px; height: 16px; color: var(--text2); }
.ctl.sq { width: 34px; padding: 0; justify-content: center; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; display: flex; flex-direction: column; }
.chart { display: grid !important; }
.ph2 { display: flex; align-items: center; gap: 9px; padding: 12px 14px 8px; font-weight: 600; font-size: 14px; }
.ph2 .ico { color: var(--text2); }
.ph2 .muted { color: var(--text2); font-weight: 400; }
.ph2 .go { margin-left: auto; color: var(--text3); width: 16px; height: 16px; }
.ph2 a { margin-left: auto; color: var(--accent); font-weight: 500; font-size: 12px; }

/* KPI tiles */
.top { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) 1.2fr; grid-template-rows: 112px 112px; gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid;
        grid-template-columns: 44px 1fr; column-gap: 12px; position: relative; cursor: pointer; min-width: 0; }
.tile.hover { border-color: color-mix(in srgb, var(--k) 70%, var(--line)); background: var(--panel-2); }
.chip { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: var(--k);
        background: color-mix(in srgb, var(--k) calc(var(--chip-a) * 100%), transparent); border: 1px solid color-mix(in srgb, var(--k) 30%, transparent); }
.chip .ico { width: 22px; height: 22px; }
.tb-body { display: grid; grid-template-rows: 18px 1fr 18px; min-width: 0; }
.tl { display: flex; align-items: center; color: var(--text2); font-weight: 500; font-size: 12.5px; }
.tl .go { margin-left: auto; width: 15px; height: 15px; color: var(--text3); }
.tl .meta { margin-left: auto; color: var(--text2); font-weight: 400; font-size: 12px; white-space: nowrap; }
.tl .i { margin-left: 8px; width: 16px; height: 16px; border-radius: 50%; border: 1.3px solid var(--text3); color: var(--text3); font: italic 600 10px/13px Georgia, serif;
         text-align: center; flex: none; }
.tl .i.on { border-color: var(--k); color: var(--k); background: color-mix(in srgb, var(--k) 15%, transparent); }
.tf .hw { color: var(--text); font-weight: 500; }
.tv { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tv b { font-size: 26px; font-weight: 650; letter-spacing: -.01em; line-height: 1; }
.tv b small { font-size: 15px; font-weight: 600; color: var(--text2); }
.tv .spark { flex: 1; height: 26px; min-width: 40px; }
.tf { color: var(--text2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
.k-cpu { --k: var(--c-cpu); } .k-mem { --k: var(--c-mem); } .k-gpu { --k: var(--c-gpu); } .k-disk { --k: var(--c-disk); }
.k-vuln { --k: var(--c-vuln); } .k-upd { --k: var(--c-upd); } .k-net { --k: var(--c-net); } .k-mnt { --k: var(--c-mnt); }
.pos { color: var(--pos); } .warn { color: var(--warn); } .neg { color: var(--neg); } .acc { color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.d-pos { background: var(--pos); } .d-warn { background: var(--warn); } .d-neg { background: var(--neg); } .d-info { background: var(--c-upd); }

/* attention */
.att { grid-row: span 2; display: flex; flex-direction: column; }
.att-h { margin: 0 12px; padding: 10px 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 14px;
         background: color-mix(in srgb, var(--neg) 16%, transparent); border: 1px solid color-mix(in srgb, var(--neg) 35%, transparent); }
.att-h .ico { color: var(--warn); width: 20px; height: 20px; }
.att-row { display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 18px; font-size: 13px; }
.att-row .go { margin-left: auto; width: 15px; height: 15px; color: var(--text3); }
.att-row small { color: var(--text2); margin-left: 4px; }
.btn-wide { margin: auto 12px 12px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600;
            background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }

/* middle + bottom rows */
.mid { display: grid; grid-template-columns: 1.55fr 1fr 1fr; gap: 12px; min-height: 0; }
.stack { display: grid; grid-template-rows: 1fr 1fr; gap: 12px; min-height: 0; }
.bot { display: grid; grid-template-columns: 1.55fr 1fr 1fr; gap: 12px; }
.chart { display: grid; grid-template-rows: auto 1fr; }
.tabs { margin-left: auto; display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.tabs span { padding: 4px 12px; border-radius: 6px; color: var(--text2); font-weight: 500; font-size: 12px; }
.tabs span.on { background: var(--sel); color: var(--text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.kv { padding: 2px 14px 12px; display: flex; flex-direction: column; justify-content: space-evenly; flex: 1; }
.kv .r { display: flex; align-items: center; gap: 9px; height: 26px; }
.kv .r .v { margin-left: auto; font-weight: 600; }
.kv .r .ico { width: 16px; height: 16px; color: var(--text2); }
.st { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.ok { width: 15px; height: 15px; }
.act { padding: 0 14px 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.act .r { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; height: 37px; border-top: 1px solid var(--line-soft); }
.act .r:first-child { border-top: 0; }
.act .r small { color: var(--text2); font-size: 11.5px; }
.sar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 2px 14px 14px; }
.sar div { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px 4px; background: var(--panel-2); }
.sar span { color: var(--text2); font-size: 12px; } .sar b { display: block; font-size: 18px; font-weight: 650; margin: 1px 0 2px; }
.sar svg { height: 30px; width: 100%; }

/* hover card + detail drawer */
.pop { position: absolute; z-index: 5; width: 380px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 10px; }
.pop::before { content: ""; position: absolute; top: -6px; left: var(--arrow, 30px); width: 10px; height: 10px; background: var(--panel-2); border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg); }
.pop h3 { font-size: 13px; display: flex; justify-content: space-between; } .pop h3 span { color: var(--text2); font-weight: 400; font-size: 12px; }
.cores { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; align-items: end; height: 36px; }
.cores i { display: block; background: var(--c-cpu); border-radius: 2px 2px 0 0; }
.pkv { display: grid; grid-template-columns: 1fr auto; row-gap: 4px; font-size: 12px; } .pkv dt { color: var(--text2); } .pkv dd { text-align: right; }
.pop .sect { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); margin-top: 2px; }
.pop .live { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pop .live div { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; padding: 6px 9px; }
.pop .live span { display: block; color: var(--text2); font-size: 11px; } .pop .live b { font-size: 14px; font-weight: 600; }
.drv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line-soft); font-size: 12px; }
.drv:first-of-type { border-top: 0; padding-top: 0; }
.drv b { font-weight: 600; font-size: 12.5px; } .drv .r2 { color: var(--text2); } .drv .ubar { grid-column: 1 / 3; justify-self: stretch; width: 100%; height: 4px; border-radius: 2px; background: var(--line-soft); overflow: hidden; margin-top: 3px; }
.drv .ubar i { display: block; height: 100%; background: var(--c-disk); border-radius: 2px; }
.tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--line-soft); color: var(--text2); margin-left: 6px; }
.memmap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.memmap div { border: 1px solid var(--line); border-radius: 6px; padding: 6px 7px; font-size: 11px; color: var(--text3); text-align: center; }
.memmap div.full { border-color: color-mix(in srgb, var(--c-mem) 55%, var(--line)); color: var(--text); background: color-mix(in srgb, var(--c-mem) 10%, transparent); }
.memmap b { display: block; font-size: 12px; }
.pop .hint { color: var(--text2); font-size: 11px; border-top: 1px solid var(--line); padding-top: 8px; }
</style>
</head>

function series(n, base, amp, seed) { let s = seed, out = []; for (let i = 0; i < n; i++) { s = (s * 9301 + 49297) % 233280; out.push(Math.max(1, base + amp * Math.sin(i / 2.3 + seed) + amp * ((s / 233280) - .5) * 1.4)); } return out; }
function spark(vals, color, h = 26, w = 120, fill = true) {
  const max = Math.max(...vals) * 1.12, min = Math.min(...vals) * 0.8, st = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * st).toFixed(1)},${(h - ((v - min) / (max - min)) * h).toFixed(1)}`).join(" ");
  const id = "g" + Math.random().toString(36).slice(2, 8);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${fill ? `<polygon points="0,${h} ${pts} ${w},${h}" fill="url(#${id})"/>` : ""}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
