name: Command Center (Qt/QML)

on:
  push:
    branches: [main, develop, "feature/**"]
    paths: ["command-center/**", "branding/design-tokens.json"]
  pull_request:
    paths: ["command-center/**", "branding/design-tokens.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qml:
    name: QML lint, headless smoke test and benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install "pydantic>=2.5" "httpx>=0.27" PyYAML paramiko secretstorage "PySide6-Essentials>=6.5"
      - name: qmllint (fails on errors; style warnings are reported)
        run: |
          out=$(pyside6-qmllint -I command-center/frontend/qml $(find command-center -name '*.qml') 2>&1 || true)
          echo "$out" | grep -c '^Warning:' | xargs echo "qmllint warnings:"
          ! echo "$out" | grep '^Error:'
      - name: Smoke test (all 14 modules, no QML warnings)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: command-center/backend:command-center/frontend
        run: python -m nexus_center --smoke
      - name: Benchmark (shared runner, software rendering; informational)
        env:
          QT_QPA_PLATFORM: offscreen
        run: scripts/benchmarks/command-center.sh --idle 10 --runs 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: command-center-benchmark-${{ github.sha }}
          path: build/benchmarks
          retention-days: 14
