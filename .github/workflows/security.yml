name: Security checks

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Static security rules, secret scan, security tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.9 "pydantic>=2.5" "httpx>=0.27" PyYAML "typer>=0.12" "rich>=13.7" paramiko secretstorage pytest
      - name: Bandit-equivalent rules (ruff S)
        run: ruff check --select S command-center packages scripts
      - name: Secret scan
        run: python scripts/validation/check_secrets.py
      - name: Registry policy (loopback ports, no Docker socket mounts, pinned sources)
        run: python scripts/validation/validate_apps.py
      - name: Privilege, validation, SSRF and credential tests
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends openssl openssh-client
          python -m pytest -q command-center/tests/test_core_security.py command-center/tests/test_agent.py \
            command-center/tests/test_gateway.py command-center/tests/test_ssh.py
