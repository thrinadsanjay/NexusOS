[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-cli"
version = "0.1.0"
description = "NexusOS Engineering Edition command-line toolkit"
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "NexusOS contributors" }]
requires-python = ">=3.11"
# Lower bounds match (or are below) the versions in Ubuntu 26.04 "resolute",
# so the Debian package can depend on python3-* system packages.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.5",
    "httpx>=0.27",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=7", "fastapi>=0.110"]

[project.scripts]
nexus = "nexus_cli.main:run"

[tool.setuptools.packages.find]
include = ["nexus_cli*"]

[tool.setuptools.package-data]
nexus_cli = ["templates/**/*"]
