# After copying the live image: remove the installer and live-session tooling from the
# installed system, then add language packs for the chosen locale when available.
---
update_db: true
ignore_update_db_error: true
backend: apt

operations:
  - remove:
      - "^live-*"
      - casper
      - calamares-settings-nexusos
      - calamares-settings-ubuntu-common
      - calamares-settings-ubuntu-common-data
      - calamares
      - calamares-data
      - libcalamaresui3.3
      - libcalamares3.3
  - try_install:
      - language-pack-$LOCALE
      - language-pack-kde-$LOCALE
      - hunspell-$LOCALE
