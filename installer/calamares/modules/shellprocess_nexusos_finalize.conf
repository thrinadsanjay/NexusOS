# NexusOS finishing steps in the installed system (run in the target chroot).
# - The live account and its passwordless sudo rule exist only in the live session; make sure
#   neither survives in the installed system.
# - Record how the system was installed (for support and the Command Center "About").
---
dontChroot: false
timeout: 120
script:
    - command: "-userdel --remove nexus-live"
    - command: "rm -f /etc/sudoers.d/casper /etc/sudoers.d/90-nexusos-live"
    - command: "mkdir -p /var/lib/nexusos"
    - command: "sh -c 'echo \"installed=$(date -u +%Y-%m-%dT%H:%M:%SZ) installer=calamares\" > /var/lib/nexusos/install-info'"
