# NexusOS installer — the first account is the machine's administrator.
# It joins the "sudo" group: the Command Center then performs administrative tasks
# with this account's sudo rights (password box), see docs/security.md.
---
doAutologin: false
setRootPassword: false
sudoersGroup: sudo

defaultGroups:
    - adm             # read system logs (Command Center: service logs, dashboard)
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - sudo            # administrative tasks through sudo
    - name: sambashare
      must_exist: false
      system: true

passwordRequirements:
    minLength: 8
    maxLength: -1
    libpwquality:
        - minlen=8
        - maxrepeat=3
        - maxsequence=3
        - usersubstr=4
        - badwords=linux,nexusos
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names:
    - root
    - nexus-live
    - nginx
    - www-data
    - daemon
    - bin
    - sys
    - sync
    - games
    - man
    - lp
    - mail
    - news
    - uucp
    - proxy
    - backup
    - list
    - irc
    - nobody
    - systemd-network
    - systemd-resolve
    - messagebus
    - polkitd
    - sddm
    - docker

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}-nexusos"
  forbidden_names: [ localhost ]
