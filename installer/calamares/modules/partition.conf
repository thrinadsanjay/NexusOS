# NexusOS installer — partitioning.
# Erase-disk installs offer full-disk encryption (LUKS2); manual partitioning is always available.
# Calamares only writes to the disk the user selects, after the summary page.
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 1G
enableLuksAutomatedPartitioning: true
luksGeneration: luks2

userSwapChoices:
    - none
    - small     # swap partition sized like RAM (at most 8 GiB)
    - suspend   # swap partition large enough to hibernate
    - file
initialSwapChoice: small

drawNestedPartitions: true
showNotEncryptedBootMessage: false
defaultFileSystemType: "ext4"
# Offered for erase installs. Manual mode lists every filesystem whose tools are installed
# (the image ships e2fsprogs, xfsprogs, btrfs-progs, dosfstools and lvm2).
availableFileSystemTypes: ["ext4", "xfs", "btrfs"]

# Manual partitioning: LVM physical volumes, volume groups and logical volumes.
lvm:
    enable: true

# No partition names (GPT labels): legacy-BIOS installs use an MBR partition table, which
# has no names, and Calamares fails the install on the "set label" job.
# Erase installs and "Default layout > Standard" in manual mode: [EFI 1G] + /boot + / (+ swap
# from the swap choice). A separate /boot keeps kernels readable by GRUB with any root
# filesystem or encryption.
partitionLayout:
    - filesystem: ext4
      noEncrypt: true
      mountPoint: "/boot"
      size: 2G
    - filesystem: unknown
      mountPoint: "/"
      size: 100%
