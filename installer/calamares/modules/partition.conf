# NexusOS installer — partitioning.
# Erase-disk installs offer full-disk encryption (LUKS2); manual partitioning is always available.
# Calamares only writes to the disk the user selects, after the summary page.
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 1G
enableLuksAutomatedPartitioning: true
luksGeneration: luks2

userSwapChoices:
    - none
    - file
initialSwapChoice: file

drawNestedPartitions: true
showNotEncryptedBootMessage: false
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

partitionLayout:
    - name: "nexusos_boot"
      filesystem: ext4
      noEncrypt: true
      onlyPresentWithEncryption: true
      mountPoint: "/boot"
      size: 4G
    - name: "nexusos_root"
      filesystem: unknown
      mountPoint: "/"
      size: 100%
