# NexusOS installer — welcome page and requirements.
---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
showDonateUrl: false

requirements:
    requiredStorage: 25        # GB: desktop + Command Center + room for containers and models
    requiredRam: 4.0           # GB: Plasma, Command Center and a browser comfortably
    internetCheckUrl: http://connectivity-check.ubuntu.com
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - root
        - storage

geoip:
    style: "none"
    url: "https://geoip.ubuntu.com/lookup"
    selector: "CountryCode"
