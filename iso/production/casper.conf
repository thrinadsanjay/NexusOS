# casper (live session) settings for the NexusOS image.
# The live account exists only in the live session (passwordless sudo, as on Ubuntu images);
# the installer creates the real administrator account.
export USERNAME="nexus-live"
export USERFULLNAME="NexusOS Live"
export HOST="nexusos"
export BUILD_SYSTEM="Ubuntu"
export FLAVOUR="NexusOS"
