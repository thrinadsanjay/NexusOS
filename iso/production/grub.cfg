# NexusOS live/installer ISO boot menu (BIOS and UEFI).
# Canonical-signed GRUB finds this file through /.disk/info on the medium.
set default=0
set timeout=10
set timeout_style=menu

loadfont unicode
insmod all_video
insmod gfxterm
set gfxmode=auto
terminal_output gfxterm

set color_normal=light-gray/black
set color_highlight=black/cyan
set menu_color_normal=light-gray/black
set menu_color_highlight=black/cyan

menuentry "Try or Install NexusOS Engineering Edition" --class nexusos {
	set gfxpayload=keep
	linux	/casper/vmlinuz boot=casper quiet splash ---
	initrd	/casper/initrd
}
menuentry "NexusOS (safe graphics)" --class nexusos {
	set gfxpayload=keep
	linux	/casper/vmlinuz boot=casper nomodeset quiet splash ---
	initrd	/casper/initrd
}
menuentry "NexusOS (text console and verbose boot, for troubleshooting)" --class nexusos {
	linux	/casper/vmlinuz boot=casper console=tty0 console=ttyS0,115200n8 systemd.show_status=1 ---
	initrd	/casper/initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry "Boot from next volume" {
	exit 1
}
menuentry "UEFI firmware settings" {
	fwsetup
}
fi
