# NexusOS overrides for ForgeCloud's docker-compose.yml (applied with -f after upstream).
# * publish the web UI on loopback only (LAN access goes through the NexusOS Gateway)
# * inject generated secrets from the deployment's .env (mode 0600)
services:
  forge:
    ports: !override
      - "127.0.0.1:4100:4100"
    environment:
      JWT_SECRET: ${JWT_SECRET:?generated by NexusOS}
      FORGE_ADMIN_PASSWORD: ${FORGE_ADMIN_PASSWORD:?generated by NexusOS}
      PROXMOX_HOST: ${PROXMOX_HOST:-}
