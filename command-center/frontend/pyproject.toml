[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-center"
version = "0.2.0"
description = "Nexus Command Center (native Qt 6 / QML)"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
dependencies = ["nexus-core", "PySide6-Essentials>=6.5"]

[project.scripts]
nexus-center = "nexus_center.app:main"

[tool.setuptools.packages.find]
include = ["nexus_center*"]
