[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agent"
version = "0.2.0"
description = "NexusOS management agent (socket-activated, polkit-authorized privileged helper)"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
dependencies = ["nexus-core"]

[tool.setuptools.packages.find]
include = ["nexus_agent*"]
